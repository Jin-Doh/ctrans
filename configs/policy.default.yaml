version: 1
runtime:
  default: docker
  supported:
    - docker
    - podman
secrets:
  mask: true
  fail_on: error
  scan_env_files: true
  sensitive_key_patterns:
    - '(?i)(password|passwd|secret|token|api[_-]?key|private[_-]?key)'
  sensitive_path_patterns:
    - '(?i)(^|/)(id_rsa|id_ed25519|.*\\.pem|.*\\.key)$'
compose:
  default_candidates:
    - docker-compose.yaml
    - compose.yaml
  default_collision: prefer_docker_compose_yaml
