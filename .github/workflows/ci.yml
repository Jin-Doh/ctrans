name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-coverage-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

      - name: Compose scan smoke
        run: make scan-compose COMPOSE_FILES="examples/compose/base.yaml" FAIL_ON=none WARNINGS=off

      - name: Compose verify smoke
        run: make verify-compose COMPOSE_FILES="examples/compose/base.yaml" FAIL_ON=none WARNINGS=off

      - name: Enforce coverage gate (>=90%)
        run: make coverage-gate THRESHOLD=90
